name: KernelOS CI

on:
  push:
    branches:
      - main
      - feature/**
      - fix/**
      - chore/**
      - docs/**
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Restore, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Show .NET version
        run: dotnet --version

      - name: Restore
        run: dotnet restore KernelOS.sln

      - name: Build
        run: dotnet build KernelOS.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test KernelOS.sln --configuration Release --no-build --no-restore --logger "trx;LogFileName=KernelOS.Tests.trx" --results-directory TestResults

      - name: Upload test results
        if: ${{ always() && hashFiles('TestResults/**/*.trx') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
