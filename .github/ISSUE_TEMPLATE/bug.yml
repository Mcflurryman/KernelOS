name: Informe de error
description: Informa de un problema encontrado en KernelOS.
title: "[Error]: "
labels: ["error"]
body:
  - type: textarea
    id: comportamiento
    attributes:
      label: Comportamiento actual y esperado
      description: Explica qué ocurre y qué debería ocurrir.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos de reproducción y entorno
      description: Pasos mínimos, versión, sistema operativo y configuración no sensible.
    validations:
      required: true
  - type: textarea
    id: evidencia
    attributes:
      label: Logs seguros e impacto
      description: Incluye logs sin secretos ni datos personales e indica el impacto.
  - type: textarea
    id: analisis
    attributes:
      label: Causa raíz y criterio de resolución
      description: Si se conoce, indica causa raíz; define cómo se comprobará la corrección.
  - type: checkboxes
    id: seguridad
    attributes:
      label: Seguridad
      options:
        - label: Confirmo que no he incluido secretos, tokens ni datos personales.
          required: true
