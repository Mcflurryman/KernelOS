name: Propuesta de funcionalidad
description: Propón una mejora para KernelOS.
title: "[Funcionalidad]: "
labels: ["mejora"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema y objetivo
      description: Qué necesidad resuelve y qué resultado se espera.
    validations:
      required: true
  - type: textarea
    id: alcance
    attributes:
      label: Alcance y fuera de alcance
      description: Indica explícitamente qué incluye y qué no incluye.
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta e impacto arquitectónico
      description: Describe el enfoque, módulos afectados, ADR necesaria y alternativas relevantes.
  - type: textarea
    id: riesgos
    attributes:
      label: Riesgos y criterios de aceptación
      description: Incluye riesgos, verificaciones y condiciones de aceptación.
    validations:
      required: true
  - type: textarea
    id: documentacion
    attributes:
      label: Documentación afectada
      description: README, arquitectura, roadmap, ADR u otros documentos a revisar.
